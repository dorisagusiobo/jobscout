[project]
name = "jobscout"
version = "0.1.0"
description = "AI job-lead agent: scans public job boards, scores fit with Claude on Amazon Bedrock, and alerts on strong matches."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=0.70",
    "boto3>=1.35",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.scripts]
jobscout = "jobscout.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
